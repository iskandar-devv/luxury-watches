<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart and checkout — Maison Aurel</title><meta name="description" content="Maison Aurel: hand-assembled luxury watches from Geneva.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/animations.css"></head>
<body data-page="cart" data-root="../"><main>
<section class="page-top"><h1>Cart</h1>
<p class="empty" id="empty" hidden>Your cart is empty.<a class="btn" href="collection.html">Browse the collection</a></p>
<div class="cart-layout" id="cart-layout" style="margin-top:48px"><ul class="lines" id="cart-items"></ul>
<form class="panel" id="checkout" data-validate novalidate><div class="sum" id="sum"></div><h3>Delivery and payment</h3><div class="fields">
<label class="full">Full name<input required autocomplete="name"><span class="err"></span></label>
<label class="full">Email<input type="email" required autocomplete="email"><span class="err"></span></label>
<label class="full">Address<input required autocomplete="street-address"><span class="err"></span></label>
<label class="full">Card number (demo, do not enter a real card)<input required data-card inputmode="numeric" placeholder="4242 4242 4242 4242"><span class="err"></span></label></div>
<button class="btn" type="submit">Place demo order</button></form></div>
<div class="confirm" id="done" hidden><h2>Thank you. Order <span id="order-no"></span> is placed.</h2><p class="muted">This is a demo store. No payment was taken.</p><a class="btn" href="collection.html">Continue browsing</a></div></section>
</main>
<script src="../js/products.js"></script><script src="../js/cart.js"></script><script src="../js/wishlist.js"></script><script src="../js/interactions.js"></script><script src="../js/main.js"></script>
</body></html>
